[package]
name = "lyra-audit"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "audit.rs"

[dependencies]
tauri = { version = "1.6", features = ["dialog-message", "system-tray", "dialog-open", "dialog-save", "protocol-asset", "window-close", "window-maximize", "window-minimize", "window-unmaximize", "window-start-dragging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.18"
sha1 = "0.10"
rayon = "1.8"
trash = "3.1"
notify = "6.1"
