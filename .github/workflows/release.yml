name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify installer without publishing a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: check
        shell: bash
        run: |
          set -euo pipefail

          GLORIA_VER=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gloria.toml | head -n 1)
          PKG_VER=$(node -p "require('./package.json').version")
          TAURI_VER=$(node -p "require('./src-tauri/tauri.conf.json').package.version")
          CARGO_VER=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' src-tauri/Cargo.toml | head -n 1)

          if [ -z "$GLORIA_VER" ]; then
            echo "::error::Could not read version from gloria.toml"
            exit 1
          fi

          if [ "$GLORIA_VER" != "$PKG_VER" ] || [ "$GLORIA_VER" != "$TAURI_VER" ] || [ "$GLORIA_VER" != "$CARGO_VER" ]; then
            echo "::error::Version mismatch: gloria.toml=$GLORIA_VER package.json=$PKG_VER tauri.conf.json=$TAURI_VER Cargo.toml=$CARGO_VER"
            exit 1
          fi

          echo "version=$GLORIA_VER" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          PREV_VER=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            PREV_VER=$(git show "${BEFORE}:gloria.toml" 2>/dev/null | sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n 1 || true)
          fi

          if [ "$GLORIA_VER" != "$PREV_VER" ]; then
            echo "Version changed ($PREV_VER -> $GLORIA_VER); triggering release build."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version unchanged ($GLORIA_VER); skipping release build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Windows x64 installer
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.build == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        shell: pwsh
        run: npm ci

      - name: Run frontend tests
        shell: pwsh
        run: npm test

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Lyra (release)
        shell: pwsh
        run: cargo build --release --locked --features custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Stage application payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path app-dist | Out-Null
          Copy-Item src-tauri/target/release/lyra.exe app-dist/lyra.exe
          Get-ChildItem app-dist

      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile MicrosoftEdgeWebview2Setup.exe

      - name: Pack installer with GloriaSetup
        shell: pwsh
        run: |
          npx --yes gloria-setup@0.2.4 --app app-dist --manifest gloria.toml --version ${{ needs.version.outputs.version }} --webview2-bootstrapper MicrosoftEdgeWebview2Setup.exe --out dist

      - name: Verify installer dry-run
        shell: pwsh
        run: |
          $setup = "dist\Lyra_${{ needs.version.outputs.version }}_x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Expected installer not found: $setup" }
          $proc = Start-Process -FilePath $setup -ArgumentList '/S --dry-run' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "GloriaSetup dry-run failed with exit code $($proc.ExitCode)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lyra-windows-x64-setup
          path: dist/Lyra_${{ needs.version.outputs.version }}_x64-setup.exe
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run)
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lyra-windows-x64-setup
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *_x64-setup.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create, verify, and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ASSET="Lyra_${VERSION}_x64-setup.exe"
          PRERELEASE_FLAG=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            "release-assets/${ASSET}" \
            "release-assets/SHA256SUMS.txt" \
            --target "${{ github.sha }}" \
            --draft \
            --title "Lyra ${TAG}" \
            --generate-notes \
            $PRERELEASE_FLAG

          VERIFY_DIR=$(mktemp -d)
          gh release download "$TAG" --dir "$VERIFY_DIR" --pattern "$ASSET" --pattern "SHA256SUMS.txt"
          (cd "$VERIFY_DIR" && sha256sum --check SHA256SUMS.txt)

          gh release edit "$TAG" --draft=false
