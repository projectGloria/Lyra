name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (node -p "require('./src-tauri/tauri.conf.json').package.version").Trim()
          }
          if (-not $version) {
            Write-Error "Could not determine release version."
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved version: $version"

      - name: Build NSIS installer
        run: npm run build

      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            Write-Error "No NSIS installer (*-setup.exe) found in src-tauri/target/release/bundle/nsis."
            exit 1
          }
          $dest = "installers/Lyra-$env:VERSION-windows-x64.exe"
          Copy-Item -Path $installer.FullName -Destination $dest -Force
          Get-ChildItem -Path installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
