[package]
name = "lyra"
version = "1.0.0"
description = "Lyra music player"
authors = ["Lyra"]
license = "ISC"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "dialog-message",
  "global-shortcut",
  "system-tray",
  "dialog-open",
  "dialog-save",
  "protocol-asset",
  "window-close",
  "window-maximize",
  "window-minimize",
  "window-unmaximize",
  "window-start-dragging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.18"
sha1 = "0.10"
rayon = "1.8"
trash = "3.1"
notify = "6.1"

[features]
# Used for production builds and whenever devPath points at the filesystem.
# DO NOT REMOVE — `tauri build` passes it.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
